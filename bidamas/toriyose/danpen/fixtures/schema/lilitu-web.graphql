	"""
	validateCoupon(code: String!): CouponValidation!
	"""
	List active coupons (admin only)
	
	NOTE: Admin auth is enforced at the gateway level via Hive Router.
	This endpoint requires the admin JWT token in the Authorization header.
	"""
	activeCoupons: [Coupon!]!
	"""
	Get current admin user info
	
	Returns the user record for the current session (must have staff_role).
	Authentication comes from cookies/headers via middleware.
	"""
	adminMe: UserGql!
	"""
	Get admin user by ID (requires admin role)
	
	Returns the user record with staff fields.
	"""
	adminUser(id: UUID!): UserGql!
	"""
	List all staff users (requires admin role)
	
	Returns users where staff_role IS NOT NULL (excludes superadmin from UI).
	"""
	adminUsers: [UserGql!]!
	"""
	Get dashboard statistics (requires staff role)
	
	Returns overview statistics for the admin dashboard.
	Results are cached for 5 minutes to reduce database load.
	"""
	adminDashboardStats: AdminDashboardStats!
	"""
	List consumer users for admin panel (requires users.view permission)
	
	Returns paginated list of users with optional search and role filter.
	Each user is enriched with ban status and stealth information.
	"""
	adminConsumerUsers(
		"""
		Search by email or name
		"""
		search: String,
		"""
		Filter by role
		"""
		role: UserRoleEnum,
		"""
		Number of items to return (max 100)
		"""
		limit: Int! = 20,
		"""
		Number of items to skip
		"""
		offset: Int! = 0
	): UserConnection!
	"""
	List consumer users with cursor-based pagination for infinite scroll (requires users.view permission)
	
	Returns cursor-based connection for real-time infinite scroll.
	Each user is enriched with ban status and stealth information.
	Use this for the modern admin users page with virtualized lists.
	"""
	adminConsumerUsersCursor(
		"""
		Cursor for pagination (from previous response)
		"""
		after: String,
		"""
		Number of items to return (max 100)
		"""
		first: Int! = 20,
		"""
		Search by email or name
		"""
		search: String,
		"""
		Filter by role
		"""
		role: UserRoleEnum
	): UserCursorConnection!
	"""
	Unified admin users query with extended filters (requires users.view permission)
	
	Replaces the three separate queries (adminConsumerUsersCursor, adminPendingUsers,
	adminDeletedUsers) with a single query that supports filtering by:
	- Status: active, pending, deleted (can select multiple)
	- User type: consumer, provider
	- Staff role
	- Profile visibility (providers only)
	- Boost status (providers only)
	- Prive mode status (providers only)
	
	Each user is enriched with ban status and stealth information.
	"""
	adminUsersUnified(
		"""
		Filter and pagination input
		"""
		input: AdminUsersUnifiedInput!
	): UserCursorConnection!

fragment ConsumerFavoriteFields on ConsumerFavorite {
		id
		consumerId
		providerId
		createdAt
		updatedAt
	}

	fragment FavoriteResponseFields on FavoriteResponse {
		success
		favorite {
			...ConsumerFavoriteFields
		}
		previousProviderId
	}

	mutation FavoriteProvider($providerId: UUID!) {
		favoriteProvider(providerId: $providerId) {
			...FavoriteResponseFields
		}
	}

[package]
name = "blue-lang-fmt"
description = "blue's canonical formatter. One output per program; no configuration surface exists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
blue-lang-syntax = { workspace = true }
tatara-lisp = { workspace = true }

[dev-dependencies]
# The layout laws over GENERATED programs (tests/laws.rs): random nesting and
# name lengths reach widths no hand-written corpus does. Already in the lock via
# blue-lang-syntax; dev-only, so no consumer carries it.
proptest = "1"

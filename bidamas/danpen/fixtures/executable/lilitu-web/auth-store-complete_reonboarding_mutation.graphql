mutation CompleteReonboarding($input: CompleteReonboardingInput!) {
    completeReonboarding(input: $input) {
      
  id
  name
  email
  emailVerified
  avatarUrl
  whatsapp
  userType
  roles
  staffRole
  permissions
  roleLevel
  homeCity
  homeNeighborhood
  needsReonboarding
  createdAt
  updatedAt

    }
  }

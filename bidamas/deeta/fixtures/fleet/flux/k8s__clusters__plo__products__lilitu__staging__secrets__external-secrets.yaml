---
# ExternalSecret for PostgreSQL credentials
# Pulls credentials from OpenBao and creates K8s Secret
# CloudNativePG expects: username, password in basic-auth format
# CRITICAL: This secret is used during CNPG cluster bootstrap - must never be pruned
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-postgres-credentials
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: database
  annotations:
    # Prevent FluxCD from deleting this ExternalSecret during prune operations
    # CNPG uses this password during initial cluster creation - deletion causes password mismatch
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/lilitu/staging/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/lilitu/staging/postgres
        property: password
---
# ExternalSecret for PostgreSQL connection string (for app usage)
# CRITICAL: Must stay in sync with lilitu-postgres-credentials - never prune
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-postgres-connection
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: database
  annotations:
    # Prevent FluxCD from deleting this ExternalSecret during prune operations
    # Password must stay in sync with PostgreSQL - deletion causes authentication failures
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-postgres-connection
    creationPolicy: Owner
    template:
      data:
        # Standard connection string for Rust sqlx/diesel
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}"
        # Individual components for flexibility
        POSTGRES_HOST: "{{ .host }}"
        POSTGRES_PORT: "{{ .port }}"
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DATABASE: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/lilitu/staging/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/lilitu/staging/postgres
        property: password
    - secretKey: host
      remoteRef:
        key: secret/data/lilitu/staging/postgres
        property: host
    - secretKey: port
      remoteRef:
        key: secret/data/lilitu/staging/postgres
        property: port
    - secretKey: database
      remoteRef:
        key: secret/data/lilitu/staging/postgres
        property: database
---
# ExternalSecret for Dragonfly cache credentials (for operator)
# CRITICAL: Cache operator uses this for authentication - never prune
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-cache-credentials
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: cache
  annotations:
    # Prevent FluxCD from deleting this ExternalSecret during prune operations
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-cache-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/lilitu/staging/cache
        property: password
---
# ExternalSecret for Dragonfly cache connection (for app usage)
# CRITICAL: Must stay in sync with cache credentials - never prune
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-cache-connection
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: cache
  annotations:
    # Prevent FluxCD from deleting this ExternalSecret during prune operations
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-cache-connection
    creationPolicy: Owner
    template:
      data:
        # Redis URL format for Rust redis-rs crate with authentication
        # Format: redis://:PASSWORD@HOST:PORT (no username, password after colon)
        REDIS_URL: "redis://:{{ .password }}@{{ .host }}:{{ .port }}"
        # Individual components
        REDIS_HOST: "{{ .host }}"
        REDIS_PORT: "{{ .port }}"
        REDIS_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: secret/data/lilitu/staging/cache
        property: password
    - secretKey: host
      remoteRef:
        key: secret/data/lilitu/staging/cache
        property: host
    - secretKey: port
      remoteRef:
        key: secret/data/lilitu/staging/cache
        property: port
---
# ExternalSecret for Resend (email provider - shared via platform)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-resend-credentials
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: email
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-resend-credentials
    creationPolicy: Owner
  data:
    # API key comes from shared platform secret
    - secretKey: api-key
      remoteRef:
        key: secret/data/platform/email/resend
        property: api-key
---
# ExternalSecret for Mercado Pago payments (PIX)
# Brazilian payment provider with 0% fee up to R$15k/month
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-mercadopago-credentials
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-mercadopago-credentials
    creationPolicy: Owner
    template:
      data:
        # Primary API authentication
        MERCADO_PAGO_ACCESS_TOKEN: "{{ .access_token }}"
        MERCADO_PAGO_PUBLIC_KEY: "{{ .public_key }}"
        # OAuth credentials (for advanced integrations)
        MERCADO_PAGO_CLIENT_ID: "{{ .client_id }}"
        MERCADO_PAGO_CLIENT_SECRET: "{{ .client_secret }}"
        # Webhook verification
        MERCADO_PAGO_WEBHOOK_SECRET: "{{ .webhook_secret }}"
  data:
    - secretKey: access_token
      remoteRef:
        key: secret/data/lilitu/staging/payments/mercadopago
        property: access-token
    - secretKey: public_key
      remoteRef:
        key: secret/data/lilitu/staging/payments/mercadopago
        property: public-key
    - secretKey: client_id
      remoteRef:
        key: secret/data/lilitu/staging/payments/mercadopago
        property: client-id
    - secretKey: client_secret
      remoteRef:
        key: secret/data/lilitu/staging/payments/mercadopago
        property: client-secret
    - secretKey: webhook_secret
      remoteRef:
        key: secret/data/lilitu/staging/payments/mercadopago
        property: webhook-secret
---
# ExternalSecret for HMAC signing secret (BFF header verification)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-hmac-secret
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-hmac-secret
    creationPolicy: Owner
  data:
    - secretKey: HMAC_SECRET
      remoteRef:
        key: secret/data/lilitu/staging/hmac
        property: secret
---
# ExternalSecret for email configuration
# API key from platform, sender config from product-specific secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-email-config
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: email
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-email-config
    creationPolicy: Owner
    template:
      data:
        # For staging, use Mailpit as SMTP fallback
        SMTP_HOST: "mailpit.mailpit.svc.cluster.local"
        SMTP_PORT: "1025"
        SMTP_USERNAME: ""
        SMTP_PASSWORD: ""
        # Resend config (primary email provider)
        EMAIL_PROVIDER: "{{ .provider }}"
        RESEND_API_KEY: "{{ .api_key }}"
        EMAIL_FROM: "{{ .from_email }}"
        EMAIL_FROM_NAME: "{{ .from_name }}"
  data:
    # API key from shared platform secret
    - secretKey: api_key
      remoteRef:
        key: secret/data/platform/email/resend
        property: api-key
    # Product-specific sender config
    - secretKey: provider
      remoteRef:
        key: secret/data/lilitu/staging/email
        property: provider
    - secretKey: from_email
      remoteRef:
        key: secret/data/lilitu/staging/email
        property: from-email
    - secretKey: from_name
      remoteRef:
        key: secret/data/lilitu/staging/email
        property: from-name
---
# ExternalSecret for backend service secrets (JWT, S3)
# CRITICAL: Backend requires these for JWT signing and S3 access - never prune
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lilitu-backend-secrets
  namespace: lilitu-staging
  labels:
    app: lilitu
    component: backend
  annotations:
    # Prevent FluxCD from deleting this ExternalSecret during prune operations
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lilitu-backend-secrets
    creationPolicy: Owner
    template:
      data:
        # JWT for admin token signing
        JWT_SECRET: "{{ .jwt_secret }}"
        # S3/RustFS credentials in the format config.rs expects
        S3_ACCESS_KEY: "{{ .s3_access_key }}"
        S3_SECRET_KEY: "{{ .s3_secret_key }}"
        S3_ENDPOINT: "{{ .s3_endpoint }}"
        S3_BUCKET: "{{ .s3_bucket }}"
        S3_PUBLIC_URL_PREFIX: "{{ .s3_public_url_prefix }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: secret/data/lilitu/staging/backend
        property: jwt-secret
    - secretKey: s3_access_key
      remoteRef:
        key: secret/data/lilitu/staging/backend
        property: s3-access-key
    - secretKey: s3_secret_key
      remoteRef:
        key: secret/data/lilitu/staging/backend
        property: s3-secret-key
    - secretKey: s3_endpoint
      remoteRef:
        key: secret/data/lilitu/staging/backend
        property: s3-endpoint
    - secretKey: s3_bucket
      remoteRef:
        key: secret/data/lilitu/staging/backend
        property: s3-bucket
    - secretKey: s3_public_url_prefix
      remoteRef:
        key: secret/data/lilitu/staging/backend
        property: s3-public-url-prefix

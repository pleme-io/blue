	User-specific overrides take precedence over this value.
	
	Requires "settings:write" permission (superadmin only).
	"""
	updateFeatureFlag(input: UpdateFeatureFlagInput!): FeatureFlag!
	"""
	Set a user-specific feature flag override
	
	Creates or updates an override for a specific user.
	The override takes precedence over the global flag state.
	
	Requires "settings:write" permission (superadmin only).
	"""
	setUserFeatureFlagOverride(input: SetUserFeatureFlagOverrideInput!): Boolean!
	"""
	Remove a user-specific feature flag override
	
	Removes the override, reverting the user to the global flag state.
	
	Requires "settings:write" permission (superadmin only).
	"""
	removeUserFeatureFlagOverride(input: RemoveUserFeatureFlagOverrideInput!): Boolean!
	"""
	Subscribe to push notifications
	
	Creates or updates a push subscription for the current user.
	If the endpoint already exists, updates the encryption keys.
	
	Requires authentication.
	"""
	subscribeToPush(input: SubscribeToPushInput!): PushSubscriptionResult!
	"""
	Unsubscribe from push notifications
	
	Removes a push subscription by endpoint.
	
	Requires authentication.
	"""
	unsubscribeFromPush(
		"""
		Web Push endpoint URL to unsubscribe
		"""
		endpoint: String!
	): PushSubscriptionResult!
	"""
	Unsubscribe all devices from push notifications
	
	Removes all push subscriptions for the current user.
	
	Requires authentication.
	"""
	unsubscribeAllFromPush: PushSubscriptionResult!
	"""
	Submit KYC verification for a provider profile
	
	The photo must contain:
	- Provider's face clearly visible
	- Original ID document (RG or CNH) held next to face
	- Handwritten sign with the expected verification code
	
	Requires authenticated user who owns the profile.
	"""
	submitKycVerification(input: SubmitKycVerificationInput!): KycVerification!
	"""

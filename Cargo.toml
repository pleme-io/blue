[workspace]
members = ["crates/blue-lang-syntax", "crates/blue-lang-fmt", "crates/blue-lang-waku", "crates/blue-lang-check", "crates/blue-lang-bidama", "crates/blue-lang-proc", "crates/blue-lang-runtime", "crates/blue-lang-cli", "crates/blue-lang-test", "crates/blue-lang-pkg", "crates/blue-lang-wasm", "crates/blue-lang-lsp", "crates/blue-lang-art"]
resolver = "2"

[workspace.package]
version = "0.0.58"
edition = "2021"
rust-version = "1.89.0"
authors = ["Pleme.io <engineering@pleme.io>"]
license = "MIT"
repository = "https://github.com/pleme-io/blue"
readme = "README.md"

[workspace.dependencies]
blue-lang-syntax = { path = "crates/blue-lang-syntax", version = "0.0.58" }
blue-lang-runtime = { path = "crates/blue-lang-runtime", version = "0.0.58" }
blue-lang-waku = { path = "crates/blue-lang-waku", version = "0.0.58" }
blue-lang-check = { path = "crates/blue-lang-check", version = "0.0.58" }
blue-lang-fmt = { path = "crates/blue-lang-fmt", version = "0.0.58" }
blue-lang-bidama = { path = "crates/blue-lang-bidama", version = "0.0.58" }
blue-lang-proc = { path = "crates/blue-lang-proc", version = "0.0.58" }
blue-lang-test = { path = "crates/blue-lang-test", version = "0.0.58" }
blue-lang-pkg = { path = "crates/blue-lang-pkg", version = "0.0.58" }
blue-lang-lsp = { path = "crates/blue-lang-lsp", version = "0.0.58" }
blue-lang-art = { path = "crates/blue-lang-art", version = "0.0.58" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# `Bluefile.lock` and `blue bluefile --json` — the evaluated manifest nix reads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Registry deps, not path deps. A path dep pointing outside the repo cannot
# resolve inside a Nix build sandbox, where the source is just this
# repository — which is precisely why tatara-lisp was extracted from the
# tatara mono-workspace (see its CLAUDE.md). Resolved from crates.io: a git
# source and a registry source are DISTINCT to cargo even at an identical
# version, so a git dep silently doubles the crate in every consumer graph —
# and a crate carrying one cannot be published at all.
tatara-lisp = "0.4"
tatara-lisp-eval = "0.4"

# The evaluator is optimized even in a debug or test build. Every in-process
# door — the conformance suite's walker, vm and wasm columns, `cargo test` of a
# bidama — runs blue programs on it, and `fn.runaway_is_bounded` spends the
# whole default 50M-step budget: 8.3 s in a plain debug build, past the suite's
# 45 s isolation limit under nix's parallel load, against 3.7 s with these.
# `blue-lang-runtime` is here too, not only the dependency, because the
# evaluator is generic over the host: `eval_in::<()>` is monomorphized, and so
# compiled, in the crate that instantiates it (measured with `sample`: the hot
# frames were tatara_lisp_eval symbols inside blue_lang_runtime).
[profile.dev.package.tatara-lisp-eval]
opt-level = 3

[profile.dev.package.tatara-lisp]
opt-level = 3

[profile.dev.package.blue-lang-runtime]
opt-level = 3

# The conformance runner instantiates the VM (`eval_program_vm::<()>`) itself.
[profile.dev.package.blue-lang-test]
opt-level = 3

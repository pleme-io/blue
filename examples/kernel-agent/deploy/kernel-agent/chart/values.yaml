access:
  effects:
    - "network"
    - "clock"
    - "entropy"
    - "environment"
    - "kernel_bpf"
  egress: []
  exec: []
  listen:
    - 18081
  reads: []
  writes: []
args: []
command: []
config: {}
flags: {}
health: "/healthz"
image:
  pullPolicy: "IfNotPresent"
  repository: "ghcr.io/pleme-io/blue"
  tag: ""
listen:
  host: "0.0.0.0"
  port: 18081
podAnnotations:
  "prometheus.io/path": "/metrics"
  "prometheus.io/port": "18081"
  "prometheus.io/scrape": "true"
podSecurityContext:
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
resources: {}
runtime:
  class: "wasm"
  component:
    app: ""
    closure: ""
    path: "component.wasm"
  kind: "native"
  reason: "device"
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - "BPF"
      - "PERFMON"
      - "NET_ADMIN"
    drop:
      - "ALL"
  readOnlyRootFilesystem: true
service:
  ports:
    - name: "http"
      port: 18081
      protocol: "TCP"
      targetPort: "http"
  type: "ClusterIP"
serviceAccount:
  automountServiceAccountToken: false
  create: true
slo:
  dashboard: true
  rules: true

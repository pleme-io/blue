[package]
name = "blue-lang-runtime"
description = "The blue runtime — one definition of what a blue program runs against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tatara-lisp = { workspace = true }
tatara-lisp-eval = { workspace = true }
blue-lang-syntax = { workspace = true }
blue-lang-check = { workspace = true }
thiserror = { workspace = true }
# Cryptography with no C (`crypto`, and `inputs`' content addressing). Features
# are pinned, not defaulted, so a default that compiles C cannot arrive on a
# version bump (pleme-style, CONTAIN THE C).
#
# `pure` turns off BLAKE3's C and assembly SIMD builds: without it, `build.rs`
# compiled NEON C intrinsics on aarch64 and linked assembly on x86_64. `cc`
# stays in the tree as blake3's unconditional build-dependency; with `pure` it
# builds nothing. `ed25519-dalek` is pure Rust over `curve25519-dalek`; `std`,
# `fast` and `zeroize` are its defaults, stated. No `rand_core`: the seed is the
# caller's, so nothing here reaches for an entropy source.
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
serde_json = "1"

[features]
# Host-side system primitives — process, filesystem, env, clock.
#
# OFF by default: the `wasm32-unknown-unknown` consumer must keep its
# zero-host-import surface, and every sys primitive is a host import. The CLI
# (the one place a user's machine can supply a process to fork) turns it on.
sys = []

[dev-dependencies]
# Cyclic in dev only, which Cargo allows: the tests need the real filesystem
# loader, the library must not (it targets wasm with no host imports).
# PATH ONLY, deliberately no version — this is a publish-cycle break.
#
# blue-lang-pkg depends on blue-lang-runtime, so a VERSIONED dev-dep back the
# other way means neither crate can ever publish first: cargo requires a
# versioned dev-dependency to resolve on the registry, and each was waiting for
# the other. Measured as `no matching package named blue-lang-pkg found`.
#
# Cargo DROPS a path-only dev-dependency when packaging, so the cycle exists
# for local `cargo test` (where it is legal and useful — the tests need the
# real filesystem loader) and does not exist in the published manifest.
blue-lang-pkg = { path = "../blue-lang-pkg" }

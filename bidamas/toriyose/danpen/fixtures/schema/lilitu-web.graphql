"""
Computed account status for admin panel display
Priority order: Deleted > Banned > Suspended > Pending > Stealthed > Active
"""
enum AccountStatus {
	"""
	User has incomplete onboarding (onboarding_completed_at IS NULL)
	"""
	PENDING
	"""
	Normal active user
	"""
	ACTIVE
	"""
	Temporary ban (has active ban with expiration)
	"""
	SUSPENDED
	"""
	Permanent ban (has active ban without expiration)
	"""
	BANNED
	"""
	Profile hidden (providers only - stealth mode)
	"""
	STEALTHED
	"""
	Soft deleted user
	"""
	DELETED
}


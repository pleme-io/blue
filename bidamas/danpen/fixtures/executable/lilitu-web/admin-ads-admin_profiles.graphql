fragment AdminProfileFields on ProviderProfile {
    id
    userId
    email
    emailVerified
    whatsapp
    username
    name
    age
    city
    neighborhood
    photos
    interests
    pricePerHourCents
    moderationStatus
    rejectionReason
    moderatedAt
    moderatedBy
    visibility
    adminStealthLocked
    autoStealthEnabled
    boostExpiresAt
    boostCampaignId
    createdAt
    updatedAt
    deletedAt
    approvedAt
    lastLoginAt
    lastActiveAt
  }

  query AdminProfiles(
    $status: ModerationStatus
    $visibility: ProfileVisibility
    $search: String
    $limit: Int = 20
    $offset: Int = 0
  ) {
    adminProfiles(
      status: $status
      visibility: $visibility
      search: $search
      limit: $limit
      offset: $offset
    ) {
      items {
        ...AdminProfileFields
      }
      total
      hasMore
    }
  }

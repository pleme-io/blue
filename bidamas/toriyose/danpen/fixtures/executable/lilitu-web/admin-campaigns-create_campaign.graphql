fragment CampaignFields on BoostCampaignGql {
    id
    name
    description
    boostExpiresAt
    reason
    createdBy
    createdAt
    isActive
    profileCount
    profileIds
  }

  mutation CreateCampaign($input: CreateCampaignInput!) {
    createCampaign(input: $input) {
      ...CampaignFields
    }
  }

"""
User entity - unified for ALL users (consumers, providers, staff)
"""
type User {
	"""
	Unique identifier
	"""
	id: UUID!
	"""
	Email address (primary identity, required)
	"""
	email: String!
	"""
	Whether email has been verified
	"""
	emailVerified: Boolean!
	"""
	Account status
	"""
	status: UserStatusEnum!
	"""
	Display name
	"""
	name: String
	"""
	Avatar URL
	"""
	avatarUrl: String
	"""
	WhatsApp number for contact
	"""
	whatsapp: String
	"""
	User type - chosen at registration, cannot be changed
	Determines what the user can do: consumers review, providers advertise
	"""
	userType: UserTypeEnum!
	"""
	When staff role was assigned
	"""
	staffAssignedAt: DateTime
	"""
	Calculated score based on last 100 reviews (0.00 - 5.00)
	Updated hourly by background job, NULL for consumers or unscored providers
	"""
	providerScore: Decimal
	"""
	Total number of reviews received (providers only)
	"""
	reviewCount: Int!
	"""
	When provider_score was last calculated by scoring job
	"""
	scoreUpdatedAt: DateTime
	"""
	Array of roles - users can have multiple (legacy, use user_type instead)
	"""
	roles: [UserRoleEnum!]!
	"""
	When user was created
	"""
	createdAt: DateTime!
	"""
	When user was last updated
	"""
	updatedAt: DateTime!
	"""
	When user last logged in
	"""
	lastLoginAt: DateTime
	"""
	Whether user must go through onboarding again when logging back in.
	Set to true when admin triggers re-onboarding (soft-delete with restoration).
	User can change role (provider/consumer) during re-onboarding.
	"""
	needsReonboarding: Boolean!
	"""
	Consumer's home city for default filter (e.g., "sao_paulo")
	"""
	homeCity: String
	"""
	Consumer's home neighborhood for default filter
	"""
	homeNeighborhood: String
	"""
	Whether this user is "encantado" (enchanted by Lilitu)
	Enchanted users get ALL paid features for free - admin toggle only
	"""
	isEncantado: Boolean!
	"""
	When user completed full onboarding flow (NULL = incomplete/abandoned)
	Users with NULL are subject to cleanup job (10-minute TTL)
	and appear in admin "Pending" tab
	"""
	onboardingCompletedAt: DateTime
	"""
	When email was verified (for 5-minute retry window logic)
	If verified within last 5 minutes, user can skip re-verification
	"""
	emailVerifiedAt: DateTime
	"""
	When user last submitted a ban appeal (rate limited to 1 per day)
	Banned users can only send one appeal message every 24 hours
	"""
	lastAppealAt: DateTime
	"""
	When user accepted Terms of Service with 18+ age confirmation
	NULL for users who registered before TOS checkbox was introduced
	"""
	tosAcceptedAt: DateTime
	"""
	Whether the user account is active (not deleted)
	"""
	isActive: Boolean!
	"""
	Whether the user can leave reviews
	Only consumers with verified emails can leave reviews
	"""
	canReview: Boolean!
	"""
	Whether the user can create advertisements
	Only providers with verified emails can create ads
	"""
	canCreateAd: Boolean!
	"""
	Whether the user is a provider (can create/manage profile)
	"""
	isProvider: Boolean!
	"""
	Whether the user is a consumer (can browse/review)
	"""
	isConsumer: Boolean!
	"""
	Whether the user is a staff member (has any staff role)
	"""
	isStaff: Boolean!
	"""
	Whether the user can access admin panel
	"""
	canAccessAdmin: Boolean!
	"""
	Whether the user is "encantado" (enchanted by Lilitu - all features free)
	"""
	isEnchanted: Boolean!
	"""
	Whether onboarding is complete (has timestamp)
	"""
	isOnboardingComplete: Boolean!
	"""
	Get computed permissions for this user based on staff role
	"""
	permissions: [String!]!
	"""
	Get the numeric role level for hierarchical comparison (1=Moderator, 2=Support, 3=Admin, 4=Superadmin)
	Returns 0 for non-staff users
	"""
	roleLevel: Int!
	"""
	Staff role derived from Zanzibar tuples (Single Source of Truth)
	
	Queries the PermissionEngine to find which role the user is a member of.
	Returns the highest role if the user has multiple (superadmin > admin > support > moderator).
	
	This replaces the deprecated `staff_role` database column.
	"""
	staffRole: StaffRoleEnum
	"""
	Formatted provider score as string (e.g., "4.5")
	Returns None for consumers or unscored providers
	"""
	formattedScore: String
}

"""
Generic paginated connection for GraphQL responses.

Each `#[graphql(concrete(...))]` line registers a named GraphQL type,
so the schema stays identical to the previous hand-written structs.

# Usage

```rust,ignore
// In a resolver:
let result: PaginatedResult<Review> = repo.find_by_provider(id, &pagination).await?;
Ok(Connection::from(result))
```
"""
type UserConnection {
	"""
	Items for the current page
	"""
	items: [UserGql!]!
	"""
	Total count of items matching the query (without pagination)
	"""
	total: Int!
	"""
	Whether there are more items after this page
	"""
	hasMore: Boolean!
}

"""
Cursor-based user connection for infinite scroll (Relay-style)
"""
type UserCursorConnection {
	"""
	List of edges (user + cursor)
	"""
	edges: [UserEdge!]!
	"""
	Pagination information
	"""
	pageInfo: PageInfo!
}

"""
A single edge in the cursor-based user connection
"""
type UserEdge {
	"""
	Opaque cursor for this item
	"""
	cursor: String!
	"""
	The user data
	"""
	node: UserGql!
}

"""
User's feature flag status (resolved with overrides)

{{- if .Values.slo.dashboard }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kernel-agent-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: kernel-agent
    app.kubernetes.io/component: slo
data:
  kernel-agent.json: |-
    {{- .Files.Get "files/dashboard.json" | trimSuffix "\n" | nindent 4 }}
{{- end }}

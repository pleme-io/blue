[workspace]
members = ["crates/blue-lang-syntax", "crates/blue-lang-fmt", "crates/blue-lang-waku", "crates/blue-lang-check", "crates/blue-lang-bidama", "crates/blue-lang-proc", "crates/blue-lang-runtime", "crates/blue-lang-cli", "crates/blue-lang-test", "crates/blue-lang-pkg", "crates/blue-lang-wasm", "crates/blue-lang-lsp", "crates/blue-lang-art"]
resolver = "2"

[workspace.package]
version = "0.0.12"
edition = "2021"
rust-version = "1.89.0"
authors = ["Pleme.io <engineering@pleme.io>"]
license = "MIT"
repository = "https://github.com/pleme-io/blue"
readme = "README.md"

[workspace.dependencies]
blue-lang-syntax = { path = "crates/blue-lang-syntax", version = "0.0.12" }
blue-lang-runtime = { path = "crates/blue-lang-runtime", version = "0.0.12" }
blue-lang-waku = { path = "crates/blue-lang-waku", version = "0.0.12" }
blue-lang-check = { path = "crates/blue-lang-check", version = "0.0.12" }
blue-lang-fmt = { path = "crates/blue-lang-fmt", version = "0.0.12" }
blue-lang-bidama = { path = "crates/blue-lang-bidama", version = "0.0.12" }
blue-lang-proc = { path = "crates/blue-lang-proc", version = "0.0.12" }
blue-lang-test = { path = "crates/blue-lang-test", version = "0.0.12" }
blue-lang-pkg = { path = "crates/blue-lang-pkg", version = "0.0.12" }
blue-lang-lsp = { path = "crates/blue-lang-lsp", version = "0.0.12" }
blue-lang-art = { path = "crates/blue-lang-art", version = "0.0.12" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# Git deps, not path deps. A path dep pointing outside the repo cannot
# resolve inside a Nix build sandbox, where the source is just this
# repository — which is precisely why tatara-lisp was extracted from the
# tatara mono-workspace (see its CLAUDE.md). Pinned by rev so a build is
# reproducible; bump the rev after pushing tatara-lisp, which is the
# trunk-based order anyway.
tatara-lisp = { version = "0.3.21", git = "https://github.com/pleme-io/tatara-lisp", rev = "ff908b2e79e988a5c017ac44ee1e9cc09f3115a7" }
tatara-lisp-eval = { version = "0.3.21", git = "https://github.com/pleme-io/tatara-lisp", rev = "ff908b2e79e988a5c017ac44ee1e9cc09f3115a7" }

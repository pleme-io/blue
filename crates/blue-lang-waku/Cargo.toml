[package]
name = "blue-lang-waku"
description = "waku — the frame a blue computation runs inside. REACH/WHEN/WHERE, and narrow cannot widen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tatara-lisp = { workspace = true }
# A NORMAL dep since M0, and therefore versioned: `Capability::Operators` is
# defined as "every `INFIX` callee" and reads that table rather than copying
# it. The repo's rule is that `INFIX` is one table and both directions read
# it — a hand-copied operator list in the capability universe would be the
# third copy that disagreed. `blue-lang-syntax` depends on no sibling, so the
# registry graph stays acyclic (`blue-lang-cli/tests/registry_graph.rs`).
blue-lang-syntax = { workspace = true }

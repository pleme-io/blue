apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-vector
  namespace: flux-system
spec:
  interval: 5m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/plo/infrastructure/observability/vector-helm
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-prometheus-operator
    - name: infrastructure-observability
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: vector
      namespace: observability

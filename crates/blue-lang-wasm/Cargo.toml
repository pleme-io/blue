[package]
name = "blue-lang-wasm"
description = "blue compiled to WebAssembly — no host imports, no WASI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Both: cdylib is the wasm artifact, rlib lets the host-side tests link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
blue-lang-runtime = { workspace = true }
tatara-lisp-eval = { workspace = true }

[dev-dependencies]
# PATH ONLY — a sibling dev-dep never carries a version. See the rule in
# `blue-lang-runtime`'s dev-dep block and the gate in `blue-lang-cli`'s
# `tests/registry_graph.rs`.
#
# A DEV dep on purpose: the frame lowering is what `tests/in_engine.rs`
# compares the engine's reported import count against, and the shipped cdylib
# must not gain a dependency to be told it imports nothing. Cargo drops a
# version-less dev-dependency from the published manifest entirely, and it is
# not built for the `wasm32-unknown-unknown` target at all.
blue-lang-waku = { path = "../blue-lang-waku" }

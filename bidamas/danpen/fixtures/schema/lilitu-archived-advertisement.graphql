extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable", "@external"])

type Advertisement @key(fields: "id") {
  id: ID!
  userId: ID!
  product: String!
  title: String!
  description: String!
  whatsappNumber: String!
  location: Location!
  age: Int!
  interests: [String!]!
  lookingFor: [String!]!
  photos: [String!]!
  status: AdStatus!
  isPaid: Boolean!
  paymentId: ID
  publishedAt: DateTime
  expiresAt: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Location {
  city: String!
  state: String!
  showDistance: Boolean!
}

enum AdStatus {
  DRAFT
  ACTIVE
  EXPIRED
  DELETED
}

extend type User @key(fields: "id") {
  id: ID! @external
  advertisements: [Advertisement!]!
}

type Query {
  advertisement(id: ID!): Advertisement
  myAdvertisements: [Advertisement!]!
  advertisementDraft(id: ID!): Advertisement
}

type Mutation {
  createAdvertisementDraft(input: CreateAdvertisementDraftInput!): Advertisement!
  publishAdvertisement(draftId: ID!, paymentId: ID!): Advertisement!
  updateAdvertisementDraft(draftId: ID!, input: UpdateAdvertisementDraftInput!): Advertisement!
  deleteAdvertisement(id: ID!): Boolean!
}

input CreateAdvertisementDraftInput {
  title: String!
  description: String!
  whatsappNumber: String!
  location: LocationInput!
  age: Int!
  interests: [String!]!
  lookingFor: [String!]!
  photos: [String!]!
  product: String!
}

input UpdateAdvertisementDraftInput {
  title: String
  description: String
  whatsappNumber: String
  location: LocationInput
  age: Int
  interests: [String!]
  lookingFor: [String!]
  photos: [String!]
}

input LocationInput {
  city: String!
  state: String!
  showDistance: Boolean!
}

scalar DateTime

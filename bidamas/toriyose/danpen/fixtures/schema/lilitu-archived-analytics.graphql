extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable", "@external"])

type PlatformSummary {
  totalUsers: Int!
  activeUsers30d: Int!
  totalAds: Int!
  activeAds: Int!
}

type Query {
  platformSummary: PlatformSummary!
}

type Mutation {
  trackAdView(advertisementId: ID!): Boolean!
}
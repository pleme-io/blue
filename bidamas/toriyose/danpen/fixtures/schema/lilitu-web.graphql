	"""
	providerId: UUID!
	"""
	Star rating (0-5)
	0 = worst experience, 5 = best experience
	"""
	rating: Int!
	"""
	Month of the review (first day of month)
	Used for unique constraint: one review per consumer per provider per month
	Prevents review bombing while allowing consumers to update opinion over time
	"""
	reviewMonth: NaiveDate!
	"""
	When review was created
	"""
	createdAt: DateTime!
	"""
	Whether the review is active (not deleted)
	"""
	isActive: Boolean!
	"""
	Month/year when this review was created (for display, e.g. "Janeiro 2025")
	"""
	reviewPeriod: String!
}


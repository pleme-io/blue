# Kavita — manga, comics, picture-book, ebook reader. Strong fit for
# the wife's children's-book reference library.

enabled: false

image:
  repository: docker.io/jvmilazz0/kavita
  tag: "0.8.6"
  pullPolicy: IfNotPresent

serviceAccount: { create: true }

ports:
  - name: http
    containerPort: 5000
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP

env:
  - name: TZ
    value: America/New_York

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 1000m, memory: 512Mi }

persistence:
  enabled: false
  storageClass: local-path
  size: 1Gi
  mountPath: /kavita/config
  zfsDataset: pool/data

volumes:
  - name: manga
    hostPath: { path: /srv/pool/media/manga, type: DirectoryOrCreate }
  - name: comics
    hostPath: { path: /srv/pool/media/comics, type: DirectoryOrCreate }
  - name: picturebooks
    hostPath: { path: /srv/pool/media/picturebooks, type: DirectoryOrCreate }

volumeMounts:
  - { name: manga,        mountPath: /manga }
  - { name: comics,       mountPath: /comics }
  - { name: picturebooks, mountPath: /picturebooks }

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: kavita.rio.lan
      paths:
        - path: /
          pathType: Prefix
  tls: { enabled: false, issuer: selfsigned }

authentik: { enabled: false }
cloudflared: { expose: false, hostname: "" }

backup:
  enabled: false
  schedule: "0 4 * * 0"
  paths: ["/kavita/config"]
  repositoryEnvFrom: { secretName: "" }
  retention: { daily: 0, weekly: 4, monthly: 6, yearly: 1 }
  image: { repository: restic/restic, tag: "0.18.0", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

monitoring: { enabled: false }
prometheusRules: { enabled: false }
alerts: { common: { enabled: false }, ntfyTopic: rio-kavita }
networkPolicy: { enabled: true }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities: { drop: [ALL] }

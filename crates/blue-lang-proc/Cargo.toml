[package]
name = "blue-lang-proc"
description = "blue processes and supervision — OTP's structure over the preemptive scheduler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tatara-lisp = { workspace = true }
tatara-lisp-eval = { workspace = true }

[dev-dependencies]
# The replay suite pins `Model::BLUE_TODAY.interleaving` against what it
# demonstrates, so the bīdama ledger cannot drift from the scheduler.
#
# PATH ONLY — a sibling dev-dep never carries a version. See the rule in
# `blue-lang-runtime`'s dev-dep block and the gate in `blue-lang-cli`'s
# `tests/registry_graph.rs`.
blue-lang-bidama = { path = "../blue-lang-bidama" }
blue-lang-runtime = { path = "../blue-lang-runtime" }
blue-lang-syntax = { path = "../blue-lang-syntax" }

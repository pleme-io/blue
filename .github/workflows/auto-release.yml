jobs:
  release:
    secrets: "inherit"
    uses: "pleme-io/substrate/.github/workflows/rust-auto-release.yml@main"
    with:
      release-ref-mode: "tag"
      source-paths: "*.rs *.b **/Bluefile **/Cargo.toml **/Cargo.lock Cargo.gen.lock"
name: "auto-release"
"on":
  push:
    branches:
      - "main"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      bump-type:
        default: "patch"
        description: "patch | minor | major"
        required: false

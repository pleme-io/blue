---
# FluxCD Kustomization for Gitea
# Self-hosted Git service at git.lilitu.io
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-gitea
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./clusters/plo/infrastructure/gitea
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  retryInterval: 1m0s
  timeout: 10m0s
  wait: false
  dependsOn:
    - name: infrastructure-tools-db
    - name: infrastructure-kanidm
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: gitea
      namespace: gitea

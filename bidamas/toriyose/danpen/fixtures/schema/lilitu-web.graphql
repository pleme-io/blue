"""
Sort field for admin users query
"""
enum AdminUsersSortField {
	"""
	Sort by creation date
	"""
	CREATED_AT
	"""
	Sort by email
	"""
	EMAIL
	"""
	Sort by name
	"""
	NAME
}

"""
Unified input for admin users query with extended filters

Replaces the three separate queries (active, pending, deleted) with a single
query that supports filtering by status, user type, profile visibility, etc.
"""
input AdminUsersUnifiedInput {
	"""
	Number of items to return (max 100, default 20)
	"""
	first: Int! = 20
	"""
	Cursor for pagination (from previous response)
	"""
	after: String
	"""
	Search by email, name, whatsapp, user ID, or profile username
	"""
	search: String
	"""
	Filter by user status (active, pending, deleted)
	If empty, defaults to [Active] to match current behavior
	"""
	status: [AdminUserStatusFilter!]
	"""
	Filter by user type (consumer, provider)
	If empty, shows all types
	"""
	userType: [UserTypeEnum!]
	"""
	Filter by staff role
	"""
	staffRole: StaffRoleEnum
	"""
	Filter by profile visibility (DRAFT, PRIVE, POSTED, STEALTH)
	Only applies to providers - consumers don't have profiles
	"""
	visibility: [ProfileVisibility!]
	"""
	Filter by boost status
	true = only boosted, false = only non-boosted, null = all
	"""
	isBoosted: Boolean
	"""
	Filter by prive mode status
	true = only with active prive, false = only without prive, null = all
	"""
	hasPrive: Boolean
	"""
	Field to sort by
	"""
	sortBy: AdminUsersSortField! = CREATED_AT
	"""
	Sort direction
	"""
	sortDirection: SortDirection! = DESC
}


{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "hello",
        "namespace": "blue-hello",
        "labels": {
          "app.kubernetes.io/managed-by": "blue",
          "app.kubernetes.io/name": "hello",
          "app.kubernetes.io/part-of": "blue-hello",
          "app.kubernetes.io/version": "0.1.0"
        }
      },
      "spec": {
        "replicas": 2,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "hello",
            "app.kubernetes.io/part-of": "blue-hello"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/managed-by": "blue",
              "app.kubernetes.io/name": "hello",
              "app.kubernetes.io/part-of": "blue-hello",
              "app.kubernetes.io/version": "0.1.0"
            }
          },
          "spec": {
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "runAsGroup": 65532,
              "fsGroup": 65532,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "hello",
                "image": "ghcr.io/pleme-io/blue-hello:0.1.0",
                "imagePullPolicy": "IfNotPresent",
                "env": [
                  {
                    "name": "HELLO_SUBJECT",
                    "value": "hello.*"
                  },
                  {
                    "name": "NATS_URL",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "blue-hello-nats",
                        "key": "url"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "10m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "memory": "64Mi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "volumeMounts": [
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    }
  ]
}

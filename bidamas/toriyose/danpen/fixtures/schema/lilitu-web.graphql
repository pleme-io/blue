"""
Minimal stealth status for provider dashboard (hides actual scores)

Providers only see whether they're in stealth mode and why.
Actual trust scores and percentiles are hidden from all users.

## Stealth Types

1. **System-initiated** (`is_system_stealth = true`):
- Triggered by low trust score (bottom 5%)
- Provider CANNOT remove this themselves
- Requires admin review to lift

2. **User-initiated** (`is_system_stealth = false`):
- Provider chose to hide their profile (vacation mode)
- Provider CAN remove this themselves anytime
"""
type ProviderStealthStatus {
	"""
	Whether in stealth mode (profile hidden from search)
	"""
	isInStealth: Boolean!
	"""
	Whether this is system-enforced (low trust) or user-initiated (vacation)
	
	If true: Provider cannot self-remove, requires admin action
	If false: Provider can toggle visibility anytime
	"""
	isSystemStealth: Boolean!
	"""
	Whether the provider can change their stealth status
	"""
	canSelfRemove: Boolean!
	"""
	User-friendly message explaining stealth status
	"""
	statusMessage: String!
	"""
	Reason for stealth (if applicable)
	"""
	stealthReason: String
	"""
	When stealth was activated (if applicable)
	"""
	stealthSince: DateTime
}


---
# FluxCD Kustomization for Arachne secrets
# Creates SOPS-encrypted K8s Secrets for arachne
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arachne-secrets
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./clusters/plo/products/arachne/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  retryInterval: 1m0s
  timeout: 10m0s
  force: false
  wait: true
  dependsOn:
    - name: arachne-init
      namespace: flux-system

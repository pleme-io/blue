[package]
name = "blue-lang-test"
description = "blue's test framework — assertions that report themselves as blue source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `sys` is ON here so a program tested through this harness can use the
# host-side system surface. The wasm consumer is never in the same build
# graph, so its zero-host-import surface is unaffected.
blue-lang-runtime = { workspace = true, features = ["sys"] }
blue-lang-syntax = { workspace = true }
blue-lang-fmt = { workspace = true }
tatara-lisp = { workspace = true }
tatara-lisp-eval = { workspace = true }

[dev-dependencies]
# PATH ONLY — a sibling dev-dep never carries a version. See the rule in
# `blue-lang-runtime`'s dev-dep block and the gate in `blue-lang-cli`'s
# `tests/registry_graph.rs`.
blue-lang-fmt = { path = "../blue-lang-fmt" }
# The conformance runner (`tests/conformance/`) drives every evaluator blue has
# and every static stage a row can observe: the check stage's registry, the
# blueshift reading, the WASM surface's ABI and the package loader. Each is a
# dev-dependency so the published harness gains nothing to run a spec row.
blue-lang-check = { path = "../blue-lang-check" }
blue-lang-lsp = { path = "../blue-lang-lsp" }
blue-lang-pkg = { path = "../blue-lang-pkg" }
blue-lang-wasm = { path = "../blue-lang-wasm" }
serde = { workspace = true }
serde_json = { workspace = true }

# The executable specification: every row in `spec/rows/*.b` on every
# evaluator, plus the missing-row gate. Its own `main`, so the report is a
# table per evaluator rather than one opaque test result. `spec/README.md`
# holds the row format.
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
harness = false

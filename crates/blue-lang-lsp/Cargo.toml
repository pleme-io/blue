[package]
name = "blue-lang-lsp"
description = "blue's language server: a transport-free analysis core plus a stdio shim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blue-lang-syntax = { workspace = true }
blue-lang-fmt = { workspace = true }
blue-lang-check = { workspace = true }
blue-lang-runtime = { workspace = true }
blue-lang-mondou = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Path only: a sibling dev-dep never carries a version (`blue-lang-cli`'s
# `tests/registry_graph.rs`).
blue-lang-pkg = { path = "../blue-lang-pkg" }

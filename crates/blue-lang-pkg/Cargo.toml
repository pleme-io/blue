[package]
name = "blue-lang-pkg"
description = "blue's package manager: the Bluefile surface and its version solver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = ["build.rs", "src/**", "tests/**", "bidamas/*/Bluefile", "bidamas/*/*.b"]

[features]
# The standard distribution (`bidamas/`) compiled into the crate, served by
# `embedded::Standard`, for a host that runs blue with no BLUE_PATH (arnes,
# hanabi). `bidamas` here is a link to the workspace's, so the registry
# package carries every Bluefile and `.b` file and the set is the same.
embedded = []
fixture = []

[dependencies]
blue-lang-runtime = { workspace = true }
# A project rule's code is validated where the registry's codes live.
blue-lang-check = { workspace = true }
blue-lang-mondou = { workspace = true }
blue-lang-syntax = { workspace = true }
# blue compiles only canonical source (`canonical`): the loader formats a
# writable package file before compiling it and refuses a read-only one.
blue-lang-fmt = { workspace = true }
blue-lang-waku = { workspace = true }
blue-lang-bidama = { workspace = true }
tatara-lisp = { workspace = true }
tatara-lisp-eval = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
blue-lang-pkg = { path = ".", features = ["fixture"] }
# PATH ONLY — a sibling dev-dep never carries a version. See the rule in
# `blue-lang-runtime`'s dev-dep block and the gate in `blue-lang-cli`'s
# `tests/registry_graph.rs`. blue-lang-test depends on blue-lang-runtime,
# which this crate depends on, so a versioned edge back is a registry cycle.
blue-lang-test = { path = "../blue-lang-test" }

---
# FluxCD Kustomization for Lilitu Instrumentation
# Grafana dashboards for Lilitu platform monitoring
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-lilitu-instrumentation
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./clusters/plo/infrastructure/lilitu-instrumentation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  retryInterval: 1m0s
  timeout: 5m0s
  wait: false
  dependsOn:
    - name: infrastructure-observability  # Grafana must be running

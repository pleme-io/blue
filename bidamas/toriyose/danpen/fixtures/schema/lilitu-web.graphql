"""
Merged mutation root combining all domain mutations
"""
type Mutation {
	"""
	Initiate a PIX payment for a profile
	
	Returns the PIX code and QR code for payment.
	When Mercado Pago is configured, creates a real PIX payment.
	In development mode, returns a mock PIX code.
	"""
	initiatePixPayment(
		"""
		Profile ID to pay for
		"""
		profileId: UUID!,
		"""
		Coupon code for discount
		"""
		couponCode: String,
		"""
		Payer email (for Mercado Pago)
		"""
		payerEmail: String,
		"""
		Payer CPF (for Mercado Pago)
		"""
		payerCpf: String
	): PaymentInitResponse!
	"""
	Confirm a PIX payment (webhook from Mercado Pago)
	
	Called when Mercado Pago notifies us of a successful payment.
	Returns the updated profile with payment confirmed.
	"""
	confirmPixPayment(paymentId: UUID!): ProviderProfile!
	"""
	Process a payment webhook from Mercado Pago (via Hanabi BFF)
	
	This mutation is called by Hanabi after it receives and verifies
	a webhook from Mercado Pago. It publishes a job to NATS for
	reliable async processing and returns immediately.
	
	# Architecture
	
	This design allows:
	1. Fast response to Mercado Pago (they require <10s response)
	2. Reliable processing with retries if something fails
	3. Backend never exposed to internet (Hanabi handles webhooks)
	"""
	processPaymentWebhook(input: PaymentWebhookInput!): PaymentWebhookResult!
	"""
	Create a new coupon (requires coupons.create permission)
	"""
	createCoupon(input: CreateCouponInput!): Coupon!
	"""
	Deactivate a coupon (requires coupons.deactivate permission)
	"""
	deactivateCoupon(code: String!): Coupon!
	"""
	Report a profile for safety violation
	
	Anyone can submit a report without authentication
	"""
	reportProfile(input: CreateReportInput!): ReportGql!
	"""
	Resolve a report (requires reports.resolve permission)
	
	Notifies the profile owner that a report was reviewed.
	"""
	resolveReport(reportId: UUID!, notes: String): ReportGql!
	"""
	Get pending reports (requires reports.view permission)
	"""
	pendingReports: [ReportGql!]!
	"""
	Logout the current admin session
	
	NOTE: With BFF session auth, logout is handled at the BFF level.
	This mutation exists for backward compatibility but simply returns true.
	The actual session invalidation happens when the user calls the BFF logout endpoint.
	
	See: .claude/skills/lilitu-auth-patterns
	"""
	adminLogout: Boolean!
	"""
	Promote a user to staff (requires users:create permission)
	
	Directly assigns a staff role to a user. No invitation flow needed.
	Sets users.staff_role and grants Zanzibar tuple.
	"""
	promoteToStaff(input: PromoteToStaffInput!): Boolean!
	"""
	Demote a staff member (requires users:deactivate permission)
	
	Removes staff role and revokes all Zanzibar tuples.
	"""
	demoteStaff(
		"""
		User ID to demote
		"""
		userId: UUID!
	): Boolean!
	"""
	Update a staff member's role (requires users:update permission)
	
	Changes the staff role and syncs Zanzibar tuples.
	"""
	updateStaffRole(input: UpdateStaffRoleInput!): Boolean!
	"""
	Warn a consumer user (requires users.warn permission)
	
	Creates a 24-hour temporary ban as a warning.
	User can still access the platform but the warning is logged.
	Notifies the user via inbox.
	"""
	warnUser(input: WarnUserInput!): Ban!
	"""
	Suspend a consumer user (requires users.suspend permission)
	
	Creates a temporary ban for the specified duration.
	Forces profile to stealth and stores previous visibility for restoration.
	Notifies the user via inbox.
	"""
	suspendUser(input: SuspendUserInput!): Ban!
	"""
	Permanently ban a consumer user (requires users.ban permission)
	
	Creates a permanent ban. User will be completely blocked.
	Forces profile to stealth and stores previous visibility for potential restoration.
	Notifies the user via inbox.
	"""
	banUser(input: BanUserActionInput!): Ban!
	"""
	Reactivate (unban) a consumer user (requires users.unban permission)
	
	Lifts all active bans on the user.
	Restores profile visibility to the state before ban was applied.
	Notifies the user via inbox.
	"""
	reactivateUser(input: ReactivateUserInput!): Boolean!
	"""
	Soft-delete a user for re-onboarding (requires users.delete permission)
	
	This operation implements the re-onboarding flow:
	1. Sets user.deleted_at = NOW(), user.status = 'deleted', user.needs_reonboarding = true
	2. Sets user.email_verified = false (forces re-verification via magic link)
	3. Hides provider_profile (visibility = 'draft') if exists - data is preserved
	4. Invalidates user cache and sessions
	5. Notifies the user via inbox
	
	When the user logs back in with their email:
	- System detects soft-deleted user with needs_reonboarding = true
	- User is restored and sent a magic link for re-verification
	- After verification, user goes through onboarding with role selection
	- User can change role (provider ↔ consumer) during re-onboarding
	- Provider profile data is preserved (hidden) and can be restored
	"""
	softDeleteUser(input: SoftDeleteUserInput!): Boolean!
	"""
	Restore a soft-deleted user (requires users.restore permission)
	
	This operation restores a user who was soft-deleted:
	1. Clears user.deleted_at, sets user.status = 'active', clears needs_reonboarding
	2. Restores provider_profile visibility if exists (draft -> posted)
	3. Invalidates user cache
	4. Notifies the user via inbox
	
	Used by admins from the "Deleted Users" tab in admin panel.
	"""
	restoreUser(input: RestoreUserInput!): Boolean!
	"""
	Set encantado (enchanted) status for a user (requires users.update permission)
	
	Encantado users get ALL paid features for free - they've been charmed by Lilitu herself.
	This is the ultimate VIP status toggle.
	
	Toggle behavior:
	- `is_encantado: true` - User becomes enchanted, all features free
	- `is_encantado: false` - User loses enchantment, normal quota rules apply
	"""
	setEncantado(input: SetEncantadoInput!): Boolean!
	"""
	Set admin stealth lock on a profile (requires users.ban permission)
	
	When locked = true:
	- Profile visibility is FORCED to Stealth
	- User CANNOT change visibility until admin unlocks
	- Shows "Admin Stealthed" badge in admin panel
	- User sees: "Sua visibilidade foi bloqueada por um administrador"
	
	When locked = false:
	- Lock is removed
	- Visibility stays stealth (user must manually change)
	"""
	setAdminStealthLock(input: SetAdminStealthLockInput!): ProviderProfile!
	"""
	Admin set profile visibility directly (requires users.moderate permission)
	
	Bypasses user control and admin_stealth_locked check.
	Admin can set any visibility state directly.
	"""
	adminSetProfileVisibility(input: AdminSetProfileVisibilityInput!): ProviderProfile!
	"""
	Admin set moderation status directly (requires users.moderate permission)
	
	Bypasses normal moderation flow - admin can directly approve/reject.
	"""
	adminSetModerationStatus(input: AdminSetModerationStatusInput!): ProviderProfile!
	"""
	Admin toggle email verification (requires users.manage permission)
	
	Bypasses magic link flow - admin can directly toggle email_verified.
	"""
	adminSetEmailVerified(input: AdminSetEmailVerifiedInput!): Boolean!
	"""
	Admin set profile boost (requires users.moderate permission)
	
	Directly sets or removes boost on a profile.
	Boosts increase profile visibility in search results.
	Does not go through campaigns - direct admin action.
	"""
	adminSetProfileBoost(input: AdminSetProfileBoostInput!): ProviderProfile!
	"""
	Modify ban duration (requires users.ban permission)
	
	Extends or reduces existing ban expiration.
	Set expires_at to null to make permanent.
	"""
	modifyBanDuration(input: ModifyBanDurationInput!): Ban!
	"""
	Ban by email address (requires users.ban permission)
	
	Creates a ban targeting an email address.
	Prevents registration with this email.
	"""
	banEmail(input: BanEmailInput!): Ban!
	"""
	Ban by WhatsApp number (requires users.ban permission)
	
	Creates a ban targeting a WhatsApp number.
	Prevents registration with this WhatsApp.
	"""
	banWhatsapp(input: BanWhatsAppInput!): Ban!
	"""
	Ban by IP address (requires users.ban permission)
	
	Creates a ban targeting an IP address.
	Prevents access from this IP.
	"""
	banIp(input: BanIpInput!): Ban!
	"""
	Hard delete a pending user who never completed onboarding (requires users.delete permission)
	
	This operation is PERMANENT and UNRECOVERABLE. It removes:
	- The user record and all associated data (cascade delete)
	
	SAFETY:
	- Only users with `onboarding_completed_at IS NULL` can be deleted this way
	- If user completed onboarding, this will fail (use soft_delete_user instead)
	- Superadmin users cannot be deleted
	
	This is intended for:
	- Admin cleanup of abandoned registration attempts
	- Users shown in "Pending" tab who never finished onboarding
	"""
	hardDeletePendingUser(
		"""
		User ID to permanently delete
		"""
		userId: UUID!
	): Boolean!
	"""
	Hard delete a user permanently (SUPERADMIN ONLY)
	
	This operation is PERMANENT and UNRECOVERABLE. It removes:
	- All user data from users table
	- All associated provider profiles
	- All associated ads and ad photos
	- All reviews (given and received)
	- All favorites
	- All inbox messages
	- All user preferences
	- All bans targeting this user
	- All admin_users records linked to this user
	
	Requires exact confirmation phrase: "PERMANENTLY DELETE"
	"""
	hardDeleteUser(input: HardDeleteUserInput!): Boolean!
	"""
	Reset all users except superadmin (SUPERADMIN ONLY)
	
	This operation is PERMANENT and UNRECOVERABLE. It removes ALL users
	and their associated data, preserving only the superadmin account(s).
	
	Hard reset all users except superadmin (SUPERADMIN-ONLY)
	
	Permanently deletes all users, profiles, and related data.
	Only superadmin can execute this mutation.
	No confirmation or reason required - direct superadmin operation.
	"""
	resetAllUsers: ResetAllUsersResult!
	"""
	Send a test push notification to a specific user (requires notifications.test permission)
	
	Publishes a push notification job via NATS to the target user's devices.
	Reuses the existing PushNotificationPayload and job executor.
	"""
	adminSendTestNotification(input: AdminSendTestNotificationInput!): AdminSendNotificationResult!
	"""
	Broadcast a push notification to all subscribed users (requires notifications.broadcast permission)
	
	If dry_run is true, returns the count without sending.
	Otherwise, publishes one NATS job per subscribed user for natural backpressure.
	"""
	adminBroadcastNotification(input: AdminBroadcastNotificationInput!): AdminBroadcastResult!
	"""
	Send an inbox message to a user or group of users (requires notifications.test permission)
	
	Supports sending to individual users, staff groups, or all users.
	The `AllUsers` audience requires SUPERADMIN role.
	If dry_run is true, returns the recipient count without sending.
	"""
	adminSendInboxMessage(input: AdminSendInboxMessageInput!): AdminSendInboxMessageResult!
	"""
	Approve a profile task (requires tasks:moderate permission)
	
	Approves the profile/ad and notifies the provider.
	Supports both ad-based tasks (legacy) and profile-based tasks (provider_profiles).
	The ad/profile becomes visible once approved.
	"""
	approveProfileTask(input: ApproveProfileTaskInput!): AdminTask!
	"""
	Reject a profile task (requires tasks:moderate permission)
	
	Rejects the profile/ad with a reason and notifies the provider.
	Supports both ad-based tasks (legacy) and profile-based tasks (provider_profiles).
	The provider can edit their profile and resubmit.
	"""
	rejectProfileTask(input: RejectProfileTaskInput!): AdminTask!
	"""
	Reject a profile task with structured reasons (requires tasks:moderate permission)
	
	Transitions the task to AwaitingChanges and sends a Card message to the
	provider with the rejection reasons. The provider can reply in the
	conversation thread and the admin sees the reply indicator.
	"""
	rejectProfileTaskStructured(input: StructuredRejectProfileTaskInput!): AdminTask!
	"""
	Approve a photo task (requires tasks:moderate permission)
	
	Approves the photo and notifies the provider.
	The photo becomes visible on the profile immediately.
	"""
	approvePhotoTask(input: ApprovePhotoTaskInput!): AdminTask!
	"""
	Reject a photo task (requires tasks:moderate permission)
	
	Rejects the photo with a reason and notifies the provider.
	The profile stays live without this photo - provider can add more photos later.
	"""
	rejectPhotoTask(input: RejectPhotoTaskInput!): AdminTask!
	"""
	Generate a presigned URL for uploading a photo directly to S3
	
	Call this before each photo upload to get a temporary upload URL.
	After upload, call confirmPhotoUpload to trigger processing.
	
	# Arguments
	* `profile_id` - ID of the profile to attach the photo to
	* `content_type` - MIME type (image/jpeg, image/png, image/webp)
	* `file_size` - Size of the file in bytes
	"""
	generatePresignedUrl(
		"""
		ID of the profile to attach the photo to
		"""
		profileId: UUID!,
		"""
		MIME type of the file (image/jpeg, image/png, image/webp)
		"""
		contentType: String!,
		"""
		Size of the file in bytes
		"""
		fileSize: Int!
	): PresignedUploadResponse!
	"""
	Confirm that a photo was uploaded and trigger image processing
	
	Call this after successfully uploading to S3 via presigned URL.
	This will:
	1. Verify the file exists in S3
	2. Convert to WebP format
	3. Generate thumbnails (150px, 600px, 1200px)
	4. Upload processed variants back to S3
	
	# Arguments
	* `profile_id` - ID of the profile this photo belongs to

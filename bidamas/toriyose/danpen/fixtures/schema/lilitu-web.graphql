type Subscription {
	"""
	Subscribe to email verification events for a specific email address.
	
	When the user clicks the verification link in their email,
	this subscription emits an event so the original browser tab
	can detect verification completion in real-time.
	
	# Arguments
	* `email` - The email address to watch for verification
	
	# Returns
	Stream of EmailVerificationEvent when the email is verified
	"""
	onEmailVerified(email: String!): EmailVerificationEvent!
	"""
	Subscribe to new inbox messages for a specific user.
	
	When a new message is delivered to the user's inbox,
	this subscription emits an event for real-time notifications.
	
	# Arguments
	* `user_id` - The user ID to watch for new messages
	
	# Returns
	Stream of InboxMessageEvent when a new message arrives
	"""
	onInboxMessage(userId: String!): InboxMessageEvent!
	"""
	Subscribe to unread count changes for a specific user.
	
	When the user's unread message count changes (new message, message read, etc.),
	this subscription emits the updated count for real-time badge updates.
	
	# Arguments
	* `user_id` - The user ID to watch for unread count changes
	
	# Returns
	Stream of UnreadCountEvent when the count changes
	"""
	onUnreadCountChanged(userId: String!): UnreadCountEvent!
	"""
	Simple ping subscription for testing WebSocket connectivity.
	Emits "pong" every second.
	"""
	ping: String!
	"""
	Subscribe to admin entity change events.
	
	This subscription notifies admin clients when entities are created, updated,
	or deleted. Events are lightweight - they indicate WHAT changed, not the data.
	Clients should invalidate relevant queries and refetch.
	
	# Arguments
	* `entity_type` - Optional filter by entity type (User, Ad, Photo, Report, etc.)
	
	# Returns
	Stream of AdminEntityEvent when entities change
	"""
	onAdminEntityChanged(
		"""
		Filter by entity type (optional)
		"""
		entityType: AdminEntityType
	): AdminEntityEvent!
	"""
	Subscribe to schedule change events for a specific user.
	
	When the user's weekly availability schedule is updated from any tab/session,
	this subscription emits an event for real-time synchronization.
	Uses source_client_id to allow clients to skip their own optimistic updates.
	
	# Arguments
	* `user_id` - The user ID to watch for schedule changes
	
	# Returns
	Stream of ScheduleChangedEvent when the user's schedule changes
	"""
	onScheduleChanged(userId: String!): ScheduleChangedEvent!
	"""
	Subscribe to payment status changes for a specific payment.
	
	When a PIX payment is processed (completed, failed, expired),
	this subscription emits an event for real-time UI updates.
	This replaces polling for payment status.
	
	# Arguments
	* `payment_id` - The payment ID to watch
	
	# Returns
	Stream of PaymentStatusEvent when the payment status changes
	"""
	onPaymentStatusChanged(paymentId: String!): PaymentStatusEvent!
	"""
	Subscribe to moderation status changes for a specific user's photos.
	
	When a photo is approved or rejected by a moderator,
	this subscription emits an event to notify the provider in real-time.
	
	# Arguments
	* `user_id` - The user ID to watch for moderation updates
	
	# Returns
	Stream of ModerationStatusEvent when a photo's status changes
	"""
	onModerationStatusChanged(userId: String!): ModerationStatusEvent!
	"""
	Subscribe to favorite events for a specific provider.
	
	When a consumer favorites or unfavorites the provider,
	this subscription emits an event for real-time notifications.
	
	# Arguments
	* `user_id` - The provider's user ID to watch for favorite events
	
	# Returns
	Stream of FavoriteEvent when the provider is favorited/unfavorited
	"""
	onFavorited(userId: String!): FavoriteEvent!
	"""
	Subscribe to profile statistics changes for a specific user.
	
	When profile stats change (views, clicks, etc.),
	this subscription emits an event for real-time dashboard updates.
	
	# Arguments
	* `user_id` - The user ID to watch for stat changes
	
	# Returns
	Stream of ProfileStatsEvent when stats change
	"""
	onProfileStatsChanged(userId: String!): ProfileStatsEvent!
	"""
	Subscribe to trust score changes for a specific user.
	
	When a user's trust score changes,
	this subscription emits an event for real-time UI updates.
	
	# Arguments
	* `user_id` - The user ID to watch for trust score changes
	
	# Returns
	Stream of TrustScoreEvent when the trust score changes
	"""
	onTrustScoreChanged(userId: String!): TrustScoreEvent!
	"""
	Subscribe to permission changes for a specific object.
	
	When permissions are granted or revoked on an object,
	this subscription emits an event for real-time UI updates.
	Clients can use this to invalidate permission caches and
	update UI elements that depend on authorization state.
	
	# Arguments
	* `object_type` - Optional filter by object type (e.g., "role", "ritual")
	* `object_id` - Optional filter by object ID
	
	# Returns
	Stream of PermissionChangedEvent when permissions change
	"""
	onPermissionChanged(objectType: String, objectId: String): PermissionChangedEvent!
	"""
	Subscribe to session invalidation events for a specific user.
	
	When the user's session is invalidated (account deleted, banned, suspended,
	password changed, etc.), this subscription emits an event for immediate logout.
	The frontend SessionGuard component uses this to force logout across all tabs.
	
	# Arguments
	* `user_id` - The user ID to watch for session invalidation
	
	# Returns
	Stream of SessionInvalidatedEvent when the user's session is invalidated
	"""
	onSessionInvalidated(userId: String!): SessionInvalidatedEvent!
	"""
	Subscribe to job progress updates for a specific job.
	
	When a bulk admin job's progress changes (items processed, status update),
	this subscription emits an event for real-time UI updates.
	Replaces polling for job status during bulk operations.
	
	# Arguments
	* `job_id` - The job ID to watch for progress updates
	
	# Returns
	Stream of JobProgressEvent when the job's progress changes
	"""
	onJobProgressChanged(jobId: String!): JobProgressEvent!
	"""
	Subscribe to wall refresh events.
	
	When the wall (pre-computed provider listing) is refreshed by the
	background worker, this subscription emits an event so frontends
	can invalidate their TanStack Query cache and display fresh data.
	
	This is a broadcast subscription — no authentication or per-user
	filtering needed since the wall is public data.
	
	# Arguments
	* `city` - Optional city filter. If provided, only emits when that city's wall is refreshed.
	
	# Returns
	Stream of WallRefreshedEvent when the wall is refreshed
	"""
	onWallRefreshed(
		"""
		Optional city filter
		"""
		city: String
	): WallRefreshedEvent!
}


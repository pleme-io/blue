---
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    kubernetes.io/metadata.name: keda
---
# KEDA core via the lareira-keda umbrella chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lareira-keda
  namespace: keda
spec:
  interval: 30m
  suspend: true
  chart:
    spec:
      chart: lareira-keda
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: pleme-charts
        namespace: flux-system
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    enabled: false  # 2026-05-03 paused fleet — set true to resume
    keda:
      enabled: false  # 2026-05-03 paused fleet — gates upstream keda subchart

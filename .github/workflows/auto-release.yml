name: auto-release

# blue's crates are absent from crates.io because nothing has ever published
# them — this repo had NO `.github/workflows/` at all (measured 2026-08-01).
# That absence is the load-bearing blocker for blue's adoption, not any gap in
# the language: a consumer that wants blue today can only reach it with a
# `git =` dependency, and a git dep inside an ALREADY-PUBLISHED crate freezes
# that crate's own publishing and silently auto-defers everything downstream
# of it. So "shikumi gains a blue config provider" is gated on this file, not
# on shikumi.
#
# Preconditions verified before adding this, rather than assumed:
#   - `GET /repos/pleme-io/blue/actions/permissions` -> {"enabled": true}.
#     blue's `org.yaml` record carries no `actions_enabled` key, so it takes
#     the default; the 14-of-860 records that pin it `false` (tear among them)
#     are the exception, and blue is not one of them.
#   - All 13 crates carry `description` + `license`, and `[workspace.package]`
#     supplies version/license/repository/readme — so cargo has what the
#     registry requires.
#   - 403 tests green on the workspace.
#
# TIER-HONEST: committing this shim proves ADOPTION, not publication. Nothing
# here is evidence that a release ran or that any crate reached the registry.
# The done-predicate is every member returning a version from
# `crates.io/api/v1/crates/<name>`.
#
# STATE, measured 2026-08-02 07:40Z (five of thirteen, not zero — the line
# above this one used to say "today it returns 404" and that is now false):
#   on the registry  blue-lang-syntax, -check, -waku, -proc at 0.0.12;
#                    blue-lang-art at 0.0.19
#   absent           blue-lang-fmt, -runtime, -bidama, -test, -lsp, -wasm,
#                    -pkg, -cli
#
# The four at 0.0.12 froze there because the registry graph went cyclic at
# v0.0.13 (see `blue-lang-cli/tests/registry_graph.rs` for the full account).
# blue-lang-art kept publishing straight through at 0.0.19 — it is the one
# member with no blue sibling in any dependency block, which is what identifies
# the cycle rather than a rate limit as the cause.
#
# Shape is the canonical 3-line consumer shim (precedent: awase, and every
# other cargo repo in the fleet). The release logic lives once in substrate;
# a hand-written publish job here would be drift.

on:
  push:
    branches: [main]
  # The drip tick. `rust-auto-release.yml`'s `drip` job — the resume engine that
  # finishes a large new-crate bootstrap across crates.io's rate-limit refill —
  # runs on exactly three events, and `schedule` is the only one that fires
  # without a human or a source change. Without it blue's bootstrap could only
  # advance on a push, and a push BUMPS, so every attempt started over at a
  # version none of the thirteen had reached.
  #
  # Nine of thirteen crates still have to be CREATED on the registry, and crate
  # creation is the rate-limited act (a new version of an existing crate is
  # cheap). A tick every 15 minutes drains that backlog hands-off and then
  # converges to a no-op in seconds — the reusable's `rust-workspace-publish`
  # is idempotent and treats already-published as success, so it is safe to
  # leave armed permanently.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    # rust-auto-release, NOT cargo-auto-release. blue is a 13-crate workspace
    # with a shared [workspace.package].version, and cargo-auto-release is the
    # SINGLE-CRATE releaser: it looks for [package].version at the repo root,
    # finds none, and stops with
    #
    #   ERROR cargo-bump: package.version not found (workspace? use
    #   rust-workspace-bump)
    #
    # which is the error naming its own fix. The first shim here used the
    # wrong one (2026-08-01) — corrected against precedent: asobi, banken and
    # carve are all workspaces on this reusable.
    #
    # The third variant, cargo-publish-each-member-auto-release, is for
    # workspaces WITHOUT a shared [workspace.package].version, so it is not
    # this repo either. Pick by workspace shape, not by name similarity.
    uses: pleme-io/substrate/.github/workflows/rust-auto-release.yml@main
    secrets: inherit

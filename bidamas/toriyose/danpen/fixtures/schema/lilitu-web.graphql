}

"""
Admin task type
"""
enum AdminTaskTypeEnum {
	"""
	Initial approval - combined profile + photos review for new providers
	This is the ONLY task created when a provider completes onboarding.
	Admin must approve ALL photos and profile data in a single action.
	Profile cannot go live until this task is approved.
	"""
	INITIAL_APPROVAL
	"""
	Profile approval (for updates to existing approved profiles)
	"""
	PROFILE_APPROVAL
	"""
	Photo approval (for new photos added to already-approved profiles)
	"""
	PHOTO_APPROVAL
	"""
	Report review
	"""
	REPORT_REVIEW
	"""
	Periodic review (90-day)
	"""
	PERIODIC_REVIEW
}

"""
User status filter for unified admin users query
Maps to the computed AccountStatus but as a filter option
"""
enum AdminUserStatusFilter {
	"""
	Active users (not deleted, onboarding complete, not banned)
	"""
	ACTIVE
	"""
	Users with incomplete onboarding
	"""
	PENDING
	"""
	Soft-deleted users
	"""
	DELETED

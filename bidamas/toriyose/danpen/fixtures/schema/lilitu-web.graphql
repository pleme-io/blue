"""
Review - consumer rating of a provider (0-5 stars)

Key constraints:
- Only consumers can leave reviews (enforced at application level)
- Only providers can be reviewed (enforced at application level)
- One review per consumer per provider per month (enforced by DB unique index on reviewer_id, profile_id, review_month)
- Rating is 0-5 (0 = worst, 5 = best)
- Reviews older than 1 year don't count for scoring
- Only last 100 reviews used in score calculations
- No text/comments - just star ratings for simplicity
"""
type Review {
	"""
	Unique identifier
	"""
	id: UUID!
	"""
	Consumer who left the review (must have user_type = 'consumer')
	"""

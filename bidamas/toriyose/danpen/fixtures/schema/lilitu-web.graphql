"""
Event emitted when the wall (pre-computed provider listing) is refreshed

Broadcast to all connected clients so they can invalidate their
TanStack Query wall cache and display fresh data. No per-user filtering
needed — the wall is public data.

Only includes city/neighborhood combinations whose content actually changed
(diff-aware). The frontend uses this for surgical per-combination cache
invalidation instead of broadcasting a broad "invalidate everything".

Special value: `"_global"` in `cities` indicates the global wall changed.
"""
type WallRefreshedEvent {
	"""
	City slugs whose city-level wall content changed.
	Includes "_global" when the global wall changed.
	"""
	cities: [String!]!
	"""
	City → neighborhood slugs whose neighborhood-level wall content changed.
	Only contains combinations where providers actually changed (diffing).
	"""
	neighborhoods: JSONObject!
	"""
	Wall refresh epoch (floor(unix_timestamp / 300))
	"""
	refreshEpoch: Int!
	"""
	Total profiles across all refreshed cities
	"""
	totalProfiles: Int!
	"""
	When the refresh completed
	"""
	refreshedAt: DateTime!
}

"""
Wall tier for display grouping

Tiers define the visual hierarchy on the home page grid.
Assigned by the wall_refresh job based on scoring criteria.
"""
enum WallTier {
	"""
	T0 - Boosted profiles (paid promotion)
	"""
	DESTAQUE
	"""
	T1 - VIP/Encantada profiles
	"""
	ENCANTADA
	"""
	T2 - Star profiles (score >= 4.0)
	"""
	ESTRELA
	"""
	T3 - Active profiles (score >= 2.0, recently active)
	"""
	ATIVA
	"""
	T4 - New profiles (cold start, < 14 days)
	"""
	NOVINHA
	"""
	T5 - Community (everyone else)
	"""
	COMUNIDADE
}


apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greeter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "greeter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "greeter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "greeter.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "greeter.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: greeter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: BLUE_SERVICE
              value: "greeter"
            - name: GREETER_LISTEN__HOST
              value: {{ .Values.listen.host | quote }}
            - name: GREETER_LISTEN__PORT
              value: {{ .Values.listen.port | quote }}
            - name: GREETER_HEALTH
              value: {{ .Values.health | quote }}
            {{- range $k, $v := .Values.config }}
            - name: {{ printf "GREETER_%s" (upper $k) }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- range $k, $v := .Values.flags }}
            - name: {{ printf "GREETER_FLAGS__%s" (upper $k) }}
              value: {{ $v | toString | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.listen.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.health | quote }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.health | quote }}
              port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

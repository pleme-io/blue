---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    kubernetes.io/metadata.name: cert-manager
---
# cert-manager via the lareira-cert-manager umbrella chart. Defaults
# (resource budgets, self-signed ClusterIssuer, alert rules) live in
# helmworks/charts/lareira-cert-manager.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lareira-cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  suspend: true
  chart:
    spec:
      chart: lareira-cert-manager
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: pleme-charts
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    enabled: false  # 2026-05-03 paused fleet — set true to resume
    # rio uses the self-signed issuer for LAN; flip selfSignedIssuer:
    # enabled=false + acmeIssuer enabled+email when public TLS is needed.

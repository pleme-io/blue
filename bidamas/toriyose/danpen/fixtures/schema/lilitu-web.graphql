"""
Admin task - a unit of work in the approval queue
"""
type AdminTask {
	"""
	Unique identifier
	"""
	id: UUID!
	"""
	Type of task (profile or photo approval)
	"""
	taskType: AdminTaskTypeEnum!
	"""
	Current status
	"""
	status: AdminTaskStatusEnum!
	"""
	Legacy: Associated ad ID (deprecated, use profile_id)
	"""
	adId: UUID
	"""
	Associated provider profile ID
	"""
	profileId: UUID
	"""
	S3 key for photo tasks (NULL for profile tasks)
	"""
	photoKey: String
	"""
	Public URL for photo tasks (NULL for profile tasks)
	"""
	photoUrl: String
	"""
	User/provider who owns the ad or profile
	"""
	userId: UUID
	"""
	Admin who resolved the task
	"""
	resolvedBy: UUID
	"""
	When the task was resolved
	"""
	resolvedAt: DateTime
	"""
	Reason for rejection (required when status=rejected)
	"""
	rejectionReason: String
	"""
	Priority (higher = processed first, default 0)
	"""
	priority: Int!
	"""
	Root inbox message ID for rejection conversation thread
	"""
	inboxThreadId: UUID
	"""
	Number of times this task has been rejected
	"""
	rejectionCount: Int!
	"""
	Whether the user has replied to the latest rejection
	"""
	hasUserReply: Boolean!
	"""
	When the task was created
	"""
	createdAt: DateTime!
	"""
	When the task was last updated
	"""
	updatedAt: DateTime!
	"""
	Metadata as JSON
	"""
	taskMetadata: JSON
	"""
	Whether the task is still active (pending or in progress)
	"""
	isActive: Boolean!
	"""
	Whether the task has been resolved
	"""
	isResolved: Boolean!
	"""
	Human-readable task type label
	"""
	typeLabel: String!
	"""
	Whether this is a photo task
	"""
	isPhotoTask: Boolean!
	"""
	Whether this is a profile task
	"""
	isProfileTask: Boolean!
	"""
	Whether this is an initial approval task (new provider onboarding)
	"""
	isInitialApproval: Boolean!
	"""
	Whether this task includes photos for review
	"""
	includesPhotos: Boolean!
	"""
	Snarky description for the card
	"""
	typeDescription: String!
	"""
	Time waiting in queue (for pending or awaiting_changes tasks)
	"""
	waitTimeSeconds: Int
	"""
	Resolve the full provider profile for this task (only for profile-related tasks)
	"""
	profile: ProviderProfile
	"""
	Rejection reason codes parsed from metadata history
	"""
	rejectionReasonCodes: [ProfileRejectionReasonCode!]
}


[workspace]
members = ["crates/blue-lang-syntax", "crates/blue-lang-fmt", "crates/blue-lang-waku", "crates/blue-lang-check", "crates/blue-lang-bidama", "crates/blue-lang-proc", "crates/blue-lang-runtime", "crates/blue-lang-cli", "crates/blue-lang-test", "crates/blue-lang-pkg", "crates/blue-lang-wasm", "crates/blue-lang-lsp", "crates/blue-lang-art"]
resolver = "2"

[workspace.package]
version = "0.0.24"
edition = "2021"
rust-version = "1.89.0"
authors = ["Pleme.io <engineering@pleme.io>"]
license = "MIT"
repository = "https://github.com/pleme-io/blue"
readme = "README.md"

[workspace.dependencies]
blue-lang-syntax = { path = "crates/blue-lang-syntax", version = "0.0.24" }
blue-lang-runtime = { path = "crates/blue-lang-runtime", version = "0.0.24" }
blue-lang-waku = { path = "crates/blue-lang-waku", version = "0.0.24" }
blue-lang-check = { path = "crates/blue-lang-check", version = "0.0.24" }
blue-lang-fmt = { path = "crates/blue-lang-fmt", version = "0.0.24" }
blue-lang-bidama = { path = "crates/blue-lang-bidama", version = "0.0.24" }
blue-lang-proc = { path = "crates/blue-lang-proc", version = "0.0.24" }
blue-lang-test = { path = "crates/blue-lang-test", version = "0.0.24" }
blue-lang-pkg = { path = "crates/blue-lang-pkg", version = "0.0.24" }
blue-lang-lsp = { path = "crates/blue-lang-lsp", version = "0.0.24" }
blue-lang-art = { path = "crates/blue-lang-art", version = "0.0.24" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# Registry deps, not path deps. A path dep pointing outside the repo cannot
# resolve inside a Nix build sandbox, where the source is just this
# repository — which is precisely why tatara-lisp was extracted from the
# tatara mono-workspace (see its CLAUDE.md). Resolved from crates.io: a git
# source and a registry source are DISTINCT to cargo even at an identical
# version, so a git dep silently doubles the crate in every consumer graph —
# and a crate carrying one cannot be published at all.
tatara-lisp = "0.3"
tatara-lisp-eval = "0.3"

name: land

on:
  push:
    branches:
      - "land/**"

permissions:
  contents: read

concurrency:
  group: land-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ !startsWith(github.ref_name, 'land/prose-') && !startsWith(github.ref_name, 'land/dry-prose-') }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  prose:
    if: ${{ startsWith(github.ref_name, 'land/prose-') || startsWith(github.ref_name, 'land/dry-prose-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: blue
        uses: pleme-io/actions/nix-build@main
        with:
          flake-ref: ".#default"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: refuse a ref that claims prose over a change that is not
        id: gates
        env:
          BLUE: ${{ steps.blue.outputs.out-path }}/bin/blue
        run: |
          [ "$("$BLUE" run --quiet gen/prepush.b -- --scope origin/main HEAD)" = prose ] || { echo "::error::this change is not prose by gen/prepush.b land_scope; land it without the prose- prefix"; exit 1; }
          echo "checks=$("$BLUE" run --quiet gen/prepush.b -- --prose-gates x86_64-linux)" >> "$GITHUB_OUTPUT"
          dirname "$BLUE" >> "$GITHUB_PATH"
      - uses: pleme-io/actions/nix-flake-check@main
        with:
          only: ${{ steps.gates.outputs.checks }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  stop-on-red:
    if: ${{ vars.BLUE_LAND_STOP_ON_RED != 'off' && !startsWith(github.ref_name, 'land/prose-') && !startsWith(github.ref_name, 'land/dry-prose-') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - id: blue
        uses: pleme-io/actions/nix-build@main
        with:
          flake-ref: ".#default"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ steps.blue.outputs.out-path }}/bin/blue run --quiet gen/land.b -- --stop-on-red "$GITHUB_RUN_ID"

  fast-forward:
    needs: [ci, prose]
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.prose.result == 'success') }}
    runs-on: ${{ github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'pleme-private') || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    steps:
      - id: token
        uses: pleme-io/actions/github-token@main
        with:
          pat: ${{ secrets.BOT_PAT }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: rehearse the fast-forward of main to ${{ github.sha }}
        if: ${{ startsWith(github.ref_name, 'land/dry-') }}
        run: git push --dry-run origin "${{ github.sha }}:refs/heads/main"
      - name: fast-forward main to ${{ github.sha }}
        id: forward
        if: ${{ !startsWith(github.ref_name, 'land/dry-') }}
        continue-on-error: true
        run: git push --atomic origin "${{ github.sha }}:refs/heads/main" ":${{ github.ref }}"
      - name: refuse the land when main moved and absorbing a release is off
        if: ${{ steps.forward.outcome == 'failure' && vars.BLUE_LAND_ABSORB_RELEASE == 'off' }}
        run: exit 1
      - id: blue
        if: ${{ steps.forward.outcome == 'failure' && vars.BLUE_LAND_ABSORB_RELEASE != 'off' }}
        uses: pleme-io/actions/nix-build@main
        with:
          flake-ref: ".#default"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: fast-forward main past the release commits that moved it
        if: ${{ steps.forward.outcome == 'failure' && vars.BLUE_LAND_ABSORB_RELEASE != 'off' }}
        run: ${{ steps.blue.outputs.out-path }}/bin/blue run --quiet gen/land.b -- --absorb-release "${{ github.sha }}" "${{ github.ref }}"
      - name: start the main-push workflows a GITHUB_TOKEN push does not start
        if: ${{ !startsWith(github.ref_name, 'land/dry-') && steps.token.outputs.source != 'app' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
        run: for w in auto-release.yml registry-flakehub.yml registry-sui.yml; do gh workflow run "$w" --ref main; done

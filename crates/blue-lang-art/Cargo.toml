[package]
name = "blue-lang-art"
description = "blue's mark, wordmark and Nord theme — the blueshift ramp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Both are public pleme-io repos, so a public `blue` stays buildable by an
# outside clone. Neither is on crates.io yet, hence the git deps.
katsuji = { version = "0.1.1", git = "https://github.com/pleme-io/katsuji", branch = "main" }
irodori = { version = "0.2.0", git = "https://github.com/pleme-io/irodori", branch = "main" }

[package]
name = "blue-lang-pkg"
description = "blue's package manager: the Bluefile surface and its version solver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blue-lang-runtime = { workspace = true }
blue-lang-syntax = { workspace = true }
blue-lang-waku = { workspace = true }
blue-lang-bidama = { workspace = true }
tatara-lisp = { workspace = true }
tatara-lisp-eval = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# PATH ONLY — a sibling dev-dep never carries a version. See the rule in
# `blue-lang-runtime`'s dev-dep block and the gate in `blue-lang-cli`'s
# `tests/registry_graph.rs`. blue-lang-test depends on blue-lang-runtime,
# which this crate depends on, so a versioned edge back is a registry cycle.
blue-lang-test = { path = "../blue-lang-test" }

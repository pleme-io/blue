query AdminAuditLogs(
    $adminId: UUID
    $action: String
    $resourceType: String
    $fromDate: DateTime
    $toDate: DateTime
    $search: String
    $limit: Int = 20
    $offset: Int = 0
  ) {
    adminAuditLogs(
      adminId: $adminId
      action: $action
      resourceType: $resourceType
      fromDate: $fromDate
      toDate: $toDate
      search: $search
      limit: $limit
      offset: $offset
    ) {
      items {
        id
        adminUserId
        adminName
        action
        resourceType
        resourceId
        changes
        ipAddress
        createdAt
      }
      total
      hasMore
    }
  }

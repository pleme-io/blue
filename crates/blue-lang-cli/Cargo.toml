[package]
name = "blue-lang-cli"
description = "The blue command line: run, fmt, ast, erase, check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "blue"
path = "src/main.rs"

[dependencies]
blue-lang-runtime = { workspace = true, features = ["sys"] }
blue-lang-syntax = { workspace = true }
blue-lang-fmt = { workspace = true }
blue-lang-check = { workspace = true }
blue-lang-test = { workspace = true }
# `embedded`: the standard distribution compiled in, the last root of every
# load path, so a script with no Bluefile and no BLUE_PATH can use retsu.
blue-lang-pkg = { workspace = true, features = ["embedded"] }
blue-lang-lsp = { workspace = true }
blue-lang-art = { workspace = true }
katsuji = "0.1"
blue-lang-waku = { workspace = true }
blue-lang-bidama = { workspace = true }
tatara-lisp-eval = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The fleet ★★ CONFIGURATION MANAGEMENT surface. `cli` brings the
# `config-show` clap factory, so `blue config <tier>` is one struct rather
# than a hand-rolled subcommand — Pillar 12 at the config boundary.
#
# The `blue` feature is deliberately OFF. shikumi's blue front-end pins
# `blue-lang-syntax = "0.0.2"` from crates.io; turning it on inside THIS
# workspace would resolve a SECOND copy of the parser beside the local
# path dep, and the `.b` config would be parsed by neither the version
# blue ships nor the one it tests. See `blue.b` for the round-trip result.
shikumi = { version = "0.1", features = ["cli"] }

# `blue repl` turns ctrl-c into an interrupt of the running evaluation: one
# `signal` call, the crate's only unsafe (`repl.rs`, `sigint`). Already in the
# lock through the toolchain's other dependents.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


mutation Register($input: RegisterInput!) {
    register(input: $input) {
      user {
        
  id
  name
  email
  emailVerified
  avatarUrl
  whatsapp
  userType
  roles
  staffRole
  permissions
  roleLevel
  homeCity
  homeNeighborhood
  needsReonboarding
  createdAt
  updatedAt

      }
    }
  }

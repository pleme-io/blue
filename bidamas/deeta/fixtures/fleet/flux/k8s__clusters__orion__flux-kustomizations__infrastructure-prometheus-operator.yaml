---
# FluxCD Kustomization for Prometheus Operator
# Installs kube-prometheus-stack for CRDs via Helm
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-prometheus-operator
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./clusters/orion/infrastructure/prometheus-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  retryInterval: 1m0s
  timeout: 10m0s  # Helm charts take longer
  wait: true
  dependsOn:
    - name: platform  # Platform must be ready first
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-operator
      namespace: prometheus-operator
